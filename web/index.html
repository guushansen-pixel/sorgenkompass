<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sorgenkompass</title>
<style>
:root {
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --bg: #12171E; --card: #1B222C; --line: #2A3441; --txt: #E8EDF2; --muted: #93A0AF;
  --acc: #7FA7E8; --acc2: #3FB6A8; --good: #4CC38A; --bad: #E5674F; --warn: #E0A93B;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--txt);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
#app { max-width: 560px; margin: 0 auto; padding: calc(var(--sat) + 8px) 14px calc(var(--sab) + 28px); }
header { display: flex; align-items: center; gap: 8px; height: 48px; }
header h1 { font-size: 20px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#back { background: none; border: 0; color: var(--txt); font-size: 30px; line-height: 1; padding: 0 12px 4px 0; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
.card h2 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.card.hi { border-color: var(--warn); } .card.acc { border-color: var(--acc); }
.muted { color: var(--muted); } .small { font-size: 13px; } .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
.big { font-size: 26px; font-weight: 700; }
.intro { color: #C5CFDA; font-size: 15px; margin: 4px 0 6px; }
button { font: inherit; color: var(--txt); background: #26303D; border: 1px solid var(--line); border-radius: 11px; padding: 10px 12px; }
button.primary { background: var(--acc); border-color: var(--acc); color: #0B1626; font-weight: 700; }
button.block { display: block; width: 100%; margin-top: 8px; }
button.ghost { background: none; } button.danger { color: var(--bad); }
button.small { font-size: 13px; padding: 6px 10px; }
button.go { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 12px 14px; }
button.go b { display: block; font-size: 16px; } button.go span { display: block; font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 14px; padding: 8px 11px; }
.chip.on { background: var(--acc); border-color: var(--acc); color: #0B1626; font-weight: 600; }
.row { display: flex; gap: 8px; align-items: center; } .row > .grow { flex: 1; min-width: 0; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; } .item > .grow { flex: 1; min-width: 0; }
.item.tap { cursor: pointer; }
.tag { font-size: 11px; padding: 2px 7px; border-radius: 8px; background: #26303D; color: var(--muted); white-space: nowrap; }
.tag.good { color: var(--good); } .tag.warn { color: var(--warn); } .tag.bad { color: var(--bad); }
label.f { display: block; margin: 12px 0 4px; font-size: 14px; color: var(--muted); }
label.f b { color: var(--txt); }
label.c { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
label.c input { width: 22px; height: 22px; flex: 0 0 auto; }
input[type=text], input[type=date], input[type=time], textarea { font: inherit; color: var(--txt); background: #0E1319; border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; }
input[type=date], input[type=time] { color-scheme: dark; }
textarea { min-height: 70px; resize: vertical; }
input[type=range] { width: 100%; accent-color: var(--acc); height: 30px; }
.sub { border: 1px solid var(--line); border-radius: 12px; padding: 4px 10px 10px; margin-top: 10px; background: #161C24; }
.sub .head { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; font-size: 13px; color: var(--muted); }
.steps { display: flex; gap: 4px; margin: 2px 0 8px; } .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); } .steps i.on { background: var(--acc); }
.nav { display: flex; gap: 8px; margin-top: 16px; } .nav button { flex: 1; }
.kv { margin: 10px 0 0; } .kv .k { font-size: 13px; color: var(--muted); } .kv .v { white-space: pre-wrap; word-wrap: break-word; }
.meter { height: 8px; background: #0E1319; border-radius: 4px; overflow: hidden; margin: 6px 0; display: flex; }
.meter i { display: block; height: 100%; }
textarea.mono { height: 140px; font: 12px/1.4 monospace; }
#modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; }
#modal[hidden] { display: none; }
#modal > div { background: var(--card); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(var(--sab) + 16px); }
#modal h3 { margin: 0 0 6px; }
.btns { display: flex; gap: 8px; margin-top: 12px; } .btns button { flex: 1; }
.foot { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
.fw { display: flex; gap: 6px; align-items: flex-start; } .fw > :first-child { flex: 1; min-width: 0; }
button.mic { flex: 0 0 auto; width: 44px; height: 44px; padding: 0; font-size: 20px; }
.vbar { display: flex; gap: 8px; margin: 6px 0 4px; } .vbar button { flex: 1; font-size: 14px; padding: 8px; }
/* Fahrmodus: grosse Schrift, zwei grosse Knoepfe, sonst nichts */
#drive { position: fixed; inset: 0; z-index: 15; background: #0B0F14; display: flex; flex-direction: column;
  padding: calc(var(--sat) + 14px) 18px calc(var(--sab) + 18px); }
#drive[hidden] { display: none; }
#d-step { color: var(--muted); font-size: 15px; }
#d-q { flex: 1; display: flex; align-items: center; font-size: 27px; line-height: 1.3; font-weight: 600; overflow: hidden; }
#d-state { font-size: 18px; color: var(--acc); min-height: 28px; }
#d-last { font-size: 15px; color: var(--muted); min-height: 44px; max-height: 88px; overflow: hidden; margin: 6px 0 12px; }
#d-btns { display: flex; gap: 10px; } #d-btns button { flex: 1; height: 84px; font-size: 20px; font-weight: 700; border-radius: 16px; }
#d-stop { background: #3A1D1A; border-color: var(--bad); }
</style>
</head>
<body>
<div id="app">
  <header><button id="back" aria-label="Zurück">‹</button><h1 id="title">Sorgenkompass</h1></header>
  <main id="view"></main>
</div>
<div id="drive" hidden>
  <div id="d-step"></div><div id="d-q"></div><div id="d-state"></div><div id="d-last"></div>
  <div id="d-btns"><button id="d-skip">Überspringen</button><button id="d-stop">Stopp</button></div>
</div>
<div id="modal" hidden><div id="modal-in"></div></div>

<script>
'use strict';
// =====================================================================
// Sorgenkompass: Stress- und Sorgen-Uebungen nach Tim Ferriss (Fear Setting),
// Dale Carnegie (Sorgen-Formel nach Willis Carrier, Stop-Loss, Tagesabschnitte),
// Stoa (Kontrollkreis) und KVT (Gedankenprotokoll), dazu Sorgenzeit und ein
// Rueckblick, der zaehlt, wie oft Befuerchtungen wirklich eintreten.
// Alle Texte selbst geschrieben, keine Buchzitate. Details in README.md.
// Aufbau: Daten -> Uebungen (TYPES) -> reine Funktionen -> Formular-Motor
//         -> Ansichten -> Dialoge -> Selbsttest (skTests, ?debug=1).
// =====================================================================
const $ = id => document.getElementById(id);
const VERSION = '1.0';

// ---------------------------------------------------------------- Daten
const KEY = 'sorgenkompass.v1';
const DEFAULT_CFG = { reviewDays: 14, worryTime: '18:00', exportOn: false, exportTitles: false, driveIntros: true };
function freshDb() { return { schema: 1, cfg: Object.assign({}, DEFAULT_CFG), entries: [], inbox: [] }; }
let saveOk = true;
function loadDb() {
  try { const j = JSON.parse(localStorage.getItem(KEY)); if (j && Array.isArray(j.entries)) return normalize(j); } catch (e) {}
  return freshDb();
}
function normalize(j) {
  const d = freshDb();
  d.cfg = Object.assign(d.cfg, j.cfg || {});
  d.entries = (j.entries || []).filter(e => e && e.id && TYPES[e.type]).map(e => Object.assign({ data: {}, done: false }, e));
  d.inbox = (j.inbox || []).filter(x => x && x.id && typeof x.text === 'string');
  return d;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); saveOk = true; } catch (e) { saveOk = false; } }

function dstr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return dstr(new Date()); }
function addDays(date, n) { const d = new Date(date + 'T12:00'); d.setDate(d.getDate() + n); return dstr(d); }
function dShort(s) { return s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' : ''; }
function dLong(s) { return s ? dShort(s) + s.slice(0, 4) : ''; }
function nowHM() { const d = new Date(); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function short(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function pct(a, b) { return b ? Math.round(a / b * 100) : 0; }

// ---------------------------------------------------------------- Uebungen
// Feldtypen: text, area, range (min/max/step/unit), check, chips (opts, multi),
// date, list (sub: Felder je Zeile), pick (Auswahl aus einer Liste des Eintrags).
// s0/s1 = Stress vorher/nachher (0-10), prob = geschaetzte Wahrscheinlichkeit (%),
// next/nextDate = naechster Schritt. Diese Schluessel liest die Auswertung.
const S0 = { k: 's0', t: 'range', label: 'Wie gestresst bist du gerade?', min: 0, max: 10, step: 1, unit: '/10', def: 5 };
const PROB = { k: 'prob', t: 'range', label: 'Wie wahrscheinlich ist es, dass das Befürchtete wirklich eintritt?', min: 0, max: 100, step: 5, unit: ' %', nodef: true };
const END = [
  { k: 'next', t: 'text', label: 'Nächster konkreter Schritt (klein genug für heute oder morgen)', ph: 'z. B. Anruf bei …, 20 Minuten recherchieren' },
  { k: 'nextDate', t: 'date', label: 'Bis wann?' },
  { k: 's1', t: 'range', label: 'Wie gestresst bist du jetzt?', min: 0, max: 10, step: 1, unit: '/10', fromS0: true }];
const DISTORT = [
  ['kat', 'Katastrophisieren', 'vom Schlimmsten ausgehen'],
  ['sw', 'Schwarz-Weiß', 'alles oder nichts, kein Dazwischen'],
  ['lesen', 'Gedankenlesen', 'zu wissen meinen, was andere denken'],
  ['hell', 'Hellsehen', 'die Zukunft als sicher ansehen'],
  ['immer', 'Verallgemeinern', '„immer“, „nie“, „alle“'],
  ['filter', 'Filtern', 'nur das Negative sehen, Gutes zählt nicht'],
  ['gefuehl', 'Gefühl als Beweis', '„ich fühle es, also stimmt es“'],
  ['muss', 'Muss-Sätze', 'starre Regeln an sich oder andere'],
  ['etikett', 'Etikettieren', '„ich bin ein Versager“ statt „das lief schlecht“'],
  ['ich', 'Persönlich nehmen', 'alles auf sich beziehen']];
const DISTORT_VK = [['katastroph', 'schlimmste'], ['schwarz', 'weiß', 'alles oder nichts'], ['gedanken lesen', 'gedankenlesen'], ['hellseh', 'zukunft'], ['verallgemein', 'immer', 'nie '], ['filter', 'negativ'], ['gefühl'], ['muss', 'müssen', 'sollte'], ['etikett', 'versager'], ['persönlich', 'auf mich bezogen']];
const ZONES = ['Liegt bei mir', 'Teilweise', 'Nicht beeinflussbar'];

const TYPES = {
  fs: {
    name: 'Fear Setting', short: 'Fear Setting', review: true,
    pitch: 'Ich überlege, etwas zu wagen oder zu ändern',
    steps: [
      { h: 'Worum geht es?', intro: 'Fear Setting nach Tim Ferriss: Statt Ziele schreibst du deine Befürchtungen auf, so genau, dass sie greifbar werden. Hinter einer Entscheidung, die man vor sich herschiebt, steckt oft eine diffuse Angst. Aufgeschrieben ist sie meist kleiner und besser zu lösen.',
        fields: [{ k: 'title', t: 'area', label: 'Was überlegst du zu tun, zu ändern oder anzusprechen?' }, S0] },
      { h: 'Befürchten · Vorbeugen · Reparieren', intro: 'Was könnte schiefgehen, wenn du es tust? Schreib jede Befürchtung einzeln auf. Dann: Was kannst du tun, damit sie gar nicht erst eintritt? Und falls sie doch eintritt: Wie bringst du es wieder in Ordnung, oder wen fragst du um Hilfe?',
        fields: [{ k: 'fears', t: 'list', add: 'Befürchtung hinzufügen', more: 'Noch eine Befürchtung?', min: 1, sub: [
          { k: 'fear', t: 'area', label: 'Befürchtung' },
          { k: 'prevent', t: 'area', label: 'Vorbeugen: Was kann ich tun, damit es nicht passiert?' },
          { k: 'repair', t: 'area', label: 'Reparieren: Was tue ich, wenn es doch passiert?' },
          { k: 'sev', t: 'range', label: 'Wie schlimm wäre das?', min: 1, max: 10, step: 1, unit: '/10', nodef: true }] }] },
      { h: 'Was bringt ein Versuch?', intro: 'Was gewinnst du, wenn es klappt oder auch nur teilweise klappt? Denk an Selbstvertrauen, Erfahrung, Geld, Beziehungen und Gesundheit.',
        fields: [{ k: 'benefits', t: 'area', label: 'Nutzen eines Versuchs oder Teilerfolgs' },
          { k: 'benefitSize', t: 'range', label: 'Wie groß wäre der Nutzen schon eines Teilerfolgs?', min: 1, max: 10, step: 1, unit: '/10', nodef: true }] },
      { h: 'Was kostet das Nichtstun?', intro: 'Wenn du es nicht tust und alles so bleibt: Wie sieht dein Leben dann aus? Denk an Gefühl, Geld und Körper. Diese Kosten übersieht man leicht, weil sie sich langsam ansammeln.',
        fields: [{ k: 'c6', t: 'area', label: 'In 6 Monaten' }, { k: 'c12', t: 'area', label: 'In 1 Jahr' }, { k: 'c36', t: 'area', label: 'In 3 Jahren' }] },
      { h: 'Entscheiden', intro: 'Leg die drei Seiten nebeneinander: Befürchtungen mit Vorbeugen und Reparieren, den Nutzen eines Versuchs und die Kosten des Nichtstuns.',
        fields: [{ k: 'decision', t: 'chips', label: 'Wie entscheidest du dich?', opts: ['Ich mache es', 'Ich teste es im Kleinen', 'Ich warte bewusst', 'Ich lasse es'], vk: [['mache', 'machen', 'tue es', 'ja'], ['test', 'klein', 'probier'], ['warte', 'später', 'abwarten'], ['lasse', 'lass', 'nicht machen', 'nein']], vorder: [1, 2, 3, 0] }, PROB].concat(END) }]
  },
  wf: {
    name: 'Sorgen-Formel', short: 'Sorgen-Formel', review: true,
    pitch: 'Ich mache mir Sorgen über etwas',
    steps: [
      { h: 'Die Sorge', intro: 'Diese Übung folgt Dale Carnegie, der sie vom Ingenieur Willis Carrier übernommen hat. Du siehst dir zuerst den schlimmsten Fall an, nimmst ihn innerlich an und verwendest die frei gewordene Kraft dann darauf, dass es besser ausgeht. So wird aus der Sorge eine Aufgabe.',
        fields: [{ k: 'title', t: 'area', label: 'Worüber machst du dir Sorgen?' }, S0] },
      { h: 'Erst die Fakten', intro: 'Viele Sorgen beruhen auf Vermutungen. Trenne, was du sicher weißt, von dem, was du nur annimmst, und schätze ehrlich, wie wahrscheinlich es ist. Die Schätzung kommt im Rückblick wieder.',
        fields: [{ k: 'facts', t: 'area', label: 'Was weiß ich sicher?' }, { k: 'guess', t: 'area', label: 'Was vermute ich nur?' }, PROB] },
      { h: 'Der schlimmste Fall', intro: 'Schau ihn dir in Ruhe an. Was wäre realistisch das Schlimmste? Meist ist es unangenehm, aber zu überleben. Wenn du ihn innerlich annimmst, hört das Kreisen oft auf.',
        fields: [{ k: 'worst', t: 'area', label: 'Was ist das Schlimmste, das realistisch passieren kann?' },
          { k: 'accept', t: 'check', label: 'Ich kann damit leben, falls es so kommt' },
          { k: 'acceptText', t: 'area', label: 'Falls es so kommt, dann …' }] },
      { h: 'Besser machen', intro: 'Der schlimmste Fall ist angenommen, der Kopf ist frei. Was kannst du jetzt tun, damit es besser ausgeht als befürchtet?',
        fields: [{ k: 'improve', t: 'area', label: 'Was kann ich tun, damit es besser ausgeht?' }, { k: 'decision', t: 'text', label: 'Meine Entscheidung' }] },
      { h: 'Der Sorge eine Grenze setzen', intro: 'Zwei Gedanken von Carnegie: Eine Sorge bekommt nur so viel Zeit und Kraft, wie sie wert ist, wie eine Verkaufsgrenze an der Börse. Und du lebst in Tagesabschnitten: Gestern ist vorbei, morgen kommt erst noch. Was gehört wirklich zu heute?',
        fields: [{ k: 'past', t: 'check', label: 'Es ist schon vorbei und nicht mehr zu ändern. Ich lasse es los.' },
          { k: 'stop', t: 'area', label: 'Was ist mir diese Sorge höchstens wert? Ab wann lasse ich sie los?' },
          { k: 'todayPart', t: 'area', label: 'Was davon gehört zu heute? Der Rest kann warten.' }] },
      { h: 'Abschluss', intro: 'Ein einziger kleiner Schritt reicht, damit aus der Sorge Handlung wird.', fields: END }]
  },
  cc: {
    name: 'Kontrollkreis', short: 'Kontrollkreis', review: false,
    pitch: 'Mir ist alles zu viel auf einmal',
    steps: [
      { h: 'Was belastet dich?', intro: 'Die Stoiker, etwa Epiktet und Mark Aurel, trennten streng: Manches liegt in unserer Hand, vieles nicht. Sorgen um das, was du nicht beeinflussen kannst, kosten Kraft und ändern nichts.',
        fields: [{ k: 'title', t: 'area', label: 'Was belastet dich gerade? Ein Stichwort reicht.' }, S0] },
      { h: 'Sortieren', intro: 'Schreib alles auf, was dir durch den Kopf geht, und ordne jeden Punkt ein.',
        fields: [{ k: 'items', t: 'list', add: 'Punkt hinzufügen', more: 'Noch ein Punkt?', min: 1, sub: [
          { k: 'text', t: 'text', label: 'Punkt' }, { k: 'zone', t: 'chips', label: 'Liegt das bei dir?', opts: ZONES, vk: [['bei mir', 'ich kann', 'ja'], ['teil', 'bisschen', 'etwas'], ['nicht', 'nein', 'kann ich nicht']], vorder: [2, 1, 0] }] }] },
      { h: 'Handeln und Loslassen', intro: 'Bei „Teilweise“: Welcher Teil liegt bei dir? Wähl einen Punkt, den du heute angehst. Den Rest legst du bewusst ab.',
        fields: [{ k: 'pick', t: 'pick', label: 'Das gehe ich heute an', from: 'items', field: 'text', filter: it => it.zone === 0 || it.zone === 1 },
          { k: 'letgo', t: 'area', label: 'Das lasse ich bewusst los' }] },
      { h: 'Abschluss', intro: '', fields: END }]
  },
  tr: {
    name: 'Gedankenprotokoll', short: 'Gedankenprotokoll', review: false,
    pitch: 'Ein Gedanke zieht mich runter',
    steps: [
      { h: 'Die Situation', intro: 'Das Gedankenprotokoll stammt aus der kognitiven Verhaltenstherapie. Das Gefühl entsteht nicht durch die Situation allein, sondern auch durch den Gedanken dazu. Den kannst du prüfen wie eine Behauptung.',
        fields: [{ k: 'title', t: 'area', label: 'Was ist passiert? Wann, wo, mit wem?' }, S0] },
      { h: 'Gedanke und Gefühl', intro: 'Schreib den Gedanken so auf, wie er in deinem Kopf klang, auch wenn er übertrieben wirkt.',
        fields: [{ k: 'thought', t: 'area', label: 'Was ging dir durch den Kopf?' }, { k: 'feeling', t: 'text', label: 'Welches Gefühl?', ph: 'z. B. Angst, Ärger, Scham' },
          { k: 'f0', t: 'range', label: 'Wie stark ist das Gefühl?', min: 0, max: 100, step: 5, unit: ' %', def: 70 }] },
      { h: 'Prüfen', intro: 'Wie vor Gericht: Was spricht dafür, was dagegen? Nur Tatsachen zählen, keine Eindrücke.',
        fields: [{ k: 'pro', t: 'area', label: 'Was spricht für den Gedanken?' }, { k: 'con', t: 'area', label: 'Was spricht dagegen?' },
          { k: 'friend', t: 'area', label: 'Was würdest du einem guten Freund in dieser Lage sagen?' }] },
      { h: 'Denkfallen', intro: 'Erkennst du eine dieser typischen Denkfallen wieder? Mehrere sind möglich.',
        fields: [{ k: 'distort', t: 'chips', multi: true, label: '', opts: DISTORT.map(d => d[1]), hints: DISTORT.map(d => d[2]), vk: DISTORT_VK, vlabel: 'Erkennst du eine Denkfalle? Zum Beispiel Katastrophisieren, Schwarz-Weiß, Gedankenlesen, Hellsehen, Verallgemeinern, Filtern, Gefühl als Beweis, Muss-Sätze, Etikettieren oder persönlich nehmen. Nenne sie, oder sag nein.' }] },
      { h: 'Neu denken', intro: 'Formuliere einen Gedanken, der fair ist: nicht schöngefärbt, aber auch nicht schwarzgemalt.',
        fields: [{ k: 'balanced', t: 'area', label: 'Ausgewogener Gedanke' },
          { k: 'f1', t: 'range', label: 'Wie stark ist das Gefühl jetzt?', min: 0, max: 100, step: 5, unit: ' %', fromKey: 'f0' }] },
      { h: 'Abschluss', intro: '', fields: END }]
  }
};
const TYPE_KEYS = Object.keys(TYPES);

// ---------------------------------------------------------------- Reine Funktionen
const HAPPENED = { nein: 0, teils: 0.5, ja: 1 };
const HAP_TXT = { nein: 'nicht eingetreten', teils: 'teilweise eingetreten', ja: 'eingetreten' };
const SEV_TXT = { milder: 'milder als befürchtet', gleich: 'so wie befürchtet', schlimmer: 'schlimmer als befürchtet' };
function newEntry(type, s0, title, now) {
  const e = { id: uid(), type, created: now || today(), done: false, data: {} };
  if (typeof s0 === 'number') e.data.s0 = s0;
  if (title) e.data.title = title;
  return e;
}
function finishEntry(e, reviewDays, now) {
  e.done = true; e.finished = now || today();
  if (TYPES[e.type].review && !e.review && !e.reviewAt) e.reviewAt = addDays(e.finished, reviewDays);
  return e;
}
function dueReviews(entries, now) {
  return entries.filter(e => e.done && TYPES[e.type] && TYPES[e.type].review && !e.review && e.reviewAt && e.reviewAt <= now)
    .sort((a, b) => a.reviewAt < b.reviewAt ? -1 : 1);
}

// ---------------------------------------------------------------- Fahrmodus
// Liest jede Frage vor, hoert die Antwort und geht selbst weiter. Bedienung
// ohne Hinsehen: "weiter"/"überspringen", "nochmal", "stopp".
const D = { on: false, id: null, skipReq: false };
const tick = () => new Promise(r => setTimeout(r, 30));
function dShow(sel, txt) { $(sel).textContent = txt || ''; }
function openDrive(stepTxt) { D.on = true; D.skipReq = false; $('drive').hidden = false; dShow('d-step', stepTxt); dShow('d-q', ''); dShow('d-state', ''); dShow('d-last', ''); }
function stopDrive() { if (!D.on && $('drive').hidden) return; D.on = false; D.id = null; Voice.stop(); $('drive').hidden = true; }
$('d-stop').onclick = stopDrive;
$('d-skip').onclick = () => { D.skipReq = true; Voice.stop(); };
async function say(text) { if (!D.on) return; dShow('d-state', '🔊 Ich lese vor …'); await Voice.speak(text); }
// Eine Frage stellen. Liefert { text } oder { cmd: 'skip'|'stop' }.
async function ask(q, prompt) {
  let pre = '';
  for (let tries = 0; tries < 4; tries++) {
    if (!D.on) return { cmd: 'stop' };
    dShow('d-q', q); await say(pre + q);
    if (!D.on) return { cmd: 'stop' };
    if (D.skipReq) { D.skipReq = false; return { cmd: 'skip' }; }
    dShow('d-state', '🎤 Ich höre zu …');
    const r = await Voice.listen(prompt || q);
    if (!D.on) return { cmd: 'stop' };
    if (D.skipReq) { D.skipReq = false; return { cmd: 'skip' }; }
    if (r.kind === 'unavailable') { stopDrive(); toast('Spracheingabe ist auf diesem Gerät nicht verfügbar.'); return { cmd: 'stop' }; }
    if (r.kind === 'heard') {
      const c = voiceCmd(r.text);
      if (c === 'repeat') { pre = ''; continue; }
      if (c) return { cmd: c };
      dShow('d-last', '„' + r.text + '“');
      return { text: r.text };
    }
    if (tries >= 1) return { cmd: 'skip' };
    pre = 'Ich habe nichts gehört. ';
  }
  return { cmd: 'skip' };
}
// Ein Feld per Sprache ausfuellen. Liefert 'stop', wenn der Fahrmodus enden soll.
async function askField(e, f, path) {
  const cur = getPath(e.data, path);
  if (f.t === 'list') {
    let rows = Array.isArray(cur) ? cur : []; if (!rows.length) { rows = [{}]; setPath(e.data, path, rows); }
    let i = rows.findIndex(r => !f.sub.some(sf => hasValue(r[sf.k])));
    if (i < 0) {
      const r = await ask('Du hast schon ' + rows.length + ' eingetragen. ' + f.more + ' Ja oder nein?');
      if (r.cmd === 'stop') return 'stop';
      if (r.cmd || !parseYesNo(r.text)) return;
      rows.push({}); i = rows.length - 1; save();
    }
    for (;;) {
      if (rows.length > 1) await say('Nummer ' + (i + 1) + '.');
      for (const sf of f.sub) if (await askField(e, sf, path + '.' + i + '.' + sf.k) === 'stop') return 'stop';
      const r = await ask(f.more + ' Ja oder nein?');
      if (r.cmd === 'stop') return 'stop';
      if (r.cmd || !parseYesNo(r.text)) { const last = rows[rows.length - 1]; if (rows.length > 1 && !f.sub.some(sf => hasValue(last[sf.k]))) rows.pop(); save(); return; }
      rows.push({}); i = rows.length - 1; save(); refreshWizard(e);
    }
  }
  // Schon Ausgefuelltes nicht nochmal fragen; Stress vorher/nachher immer.
  if (hasValue(cur) && !(f.fromS0 || f.fromKey || f.k === 's0')) return;
  let opts = null, pickList = null;
  if (f.t === 'pick') {
    pickList = (e.data[f.from] || []).filter(it => it && (it[f.field] || '').trim() && (!f.filter || f.filter(it))).map(it => it[f.field].trim());
    if (!pickList.length) return;
    opts = pickList.map((t, i) => (i + 1) + ': ' + t);
  }
  let q = fieldQuestion(f, f.t === 'pick' ? opts : null);
  if (f.t === 'pick') q = f.label + '. ' + opts.join('. ') + '. Sag die Nummer.';
  for (let tries = 0; tries < 2; tries++) {
    const r = await ask(q);
    if (r.cmd === 'stop') return 'stop';
    if (r.cmd) return;
    let v, ok = true;
    if (f.t === 'text' || f.t === 'area') v = appendText(cur, r.text);
    else if (f.t === 'range') { v = parseNumber(r.text); ok = v !== null && v >= f.min && v <= f.max; if (ok) v = Math.round(v / f.step) * f.step; }
    else if (f.t === 'check') { v = parseYesNo(r.text); ok = v !== null; }
    else if (f.t === 'date') { v = parseDate(r.text, today()); ok = !!v; }
    else if (f.t === 'chips') {
      const hits = matchOptions(r.text, f.opts, f.vk, f.vorder);
      if (f.multi) { v = hits.sort((a, b) => a - b).map(i => f.opts[i]); ok = hits.length > 0 || parseYesNo(r.text) === false; }
      else { ok = hits.length > 0; v = ok ? (f.opts === ZONES ? hits[0] : f.opts[hits[0]]) : null; }
    } else if (f.t === 'pick') {
      const num = parseNumber(r.text.replace(/\b(erste|ersten)\b/i, '1').replace(/\b(zweite|zweiten)\b/i, '2').replace(/\b(dritte|dritten)\b/i, '3'));
      let idx = num !== null && num >= 1 && num <= pickList.length ? num - 1 : pickList.findIndex(t => norm(r.text).indexOf(norm(t).trim()) >= 0);
      ok = idx >= 0; v = ok ? pickList[idx] : null;
    }
    if (ok) { setPath(e.data, path, v); save(); refreshWizard(e); return; }
    q = 'Das habe ich nicht verstanden. ' + fieldQuestion(f, f.t === 'pick' ? opts : null);
    if (f.t === 'pick') q = 'Das habe ich nicht verstanden. Sag die Nummer: ' + opts.join('. ');
  }
}
function refreshWizard(e) {
  const parts = (location.hash || '').slice(1).split('/');
  if (parts[0] === 'e' && parts[1] === e.id) { const y = window.scrollY; renderWizard(e, +parts[2] || 0); window.scrollTo(0, y); }
}
async function drive(e, n) {
  const T = TYPES[e.type];
  D.id = e.id; openDrive(T.name);
  for (let i = n; i < T.steps.length; i++) {
    if (!D.on) return;
    if (i !== n) { go('e/' + e.id + '/' + i); await tick(); }
    const st = T.steps[i];
    dShow('d-step', T.name + ' · Schritt ' + (i + 1) + ' von ' + T.steps.length);
    dShow('d-q', st.h);
    await say(db.cfg.driveIntros && st.intro ? stepSpeech(st) : st.h + '.');
    for (const f of st.fields) if (await askField(e, f, f.k) === 'stop') { stopDrive(); return; }
  }
  if (!D.on) return;
  const d = e.data, msg = typeof d.s0 === 'number' && typeof d.s1 === 'number'
    ? (d.s1 < d.s0 ? 'Dein Stress ist von ' + d.s0 + ' auf ' + d.s1 + ' gesunken.' : 'Dein Stress liegt bei ' + d.s1 + '.') : '';
  dShow('d-q', 'Fertig.'); await say('Fertig. ' + msg + (d.next ? ' Dein nächster Schritt: ' + d.next + '.' : '') + ' Alles ist gespeichert.');
  stopDrive(); finishWizard(e, T.steps.length - 1);
}
const HOME_VK = { note: ['notiz', 'notier', 'merk', 'später', 'aufschreiben'], tr: ['gedanke', 'runter', 'protokoll'], cc: ['zu viel', 'viel auf einmal', 'kontroll', 'alles'], fs: ['entscheid', 'wag', 'fear', 'änder', 'überleg', 'trau'], wf: ['sorge', 'angst', 'befürcht'] };
async function driveHome() {
  D.id = null; openDrive('Per Sprache');
  const order = ['note', 'tr', 'cc', 'fs', 'wf'];
  for (let tries = 0; tries < 2; tries++) {
    const r = await ask(tries ? 'Sag einfach: Entscheidung, Sorge, Gedanke, zu viel, oder Notiz.' : 'Was beschäftigt dich? Eine Entscheidung, eine Sorge, ein Gedanke, der dich runterzieht, ist dir alles zu viel, oder willst du nur eine Notiz für später?');
    if (r.cmd) { stopDrive(); return; }
    const hit = order.find(k => HOME_VK[k].some(w => norm(r.text).indexOf(w) >= 0));
    if (!hit) continue;
    if (hit === 'note') {
      const n = await ask('Was möchtest du notieren?');
      if (n.text) { db.inbox.push({ id: uid(), text: appendText('', n.text), created: today() }); save(); await say('Notiert. Du siehst es zur Sorgenzeit wieder.'); }
      stopDrive(); if ((location.hash || '#home') === '#home') render('home'); return;
    }
    const e = newEntry(hit); db.entries.push(e); save(); W.fromView = false;
    D.id = e.id; go('e/' + e.id + '/0'); await tick();
    return drive(e, 0);
  }
  await say('Ich habe dich nicht verstanden. Du kannst es gleich nochmal versuchen.'); stopDrive();
}
